<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>odin-calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="display">
            <p id="calc-txt">10 + 20</p>
            <p id="current-totel">30</p>
        </div>
        <div class="keyboard">
            <div class="left-controls">
                <button>0</button>
                <button>.</button>
                <button>=</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
            </div>
            <div class="right-controls">
                    <button>%</button>
                    <button>-</button>
                    <button>x</button>
                    <button>+</button>
            </div>
        </div>
    </div>
    
</body>
</html>
